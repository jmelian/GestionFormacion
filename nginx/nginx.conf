# /nginx/nginx.conf
upstream formacion_web {
    server 192.168.65.3:8000;
}

server {
    listen 80;
    client_max_body_size 50M;

    location /static/ {
        alias /vol/web/staticfiles/;
    }

        location / {
            proxy_pass http://formacion_web;

            # Usamos $http_host en lugar de $host para asegurar que el puerto :8082
            # llegue a Django. Esto es vital para ALLOWED_HOSTS y CSRF.
            proxy_set_header Host $http_host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Opcional: Aumentar timeout si la aplicación tarda en generar reportes o procesar subidas
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;

            # Directivas de cookies
            # Esta línea suele estar bien, pero comentarla si hay problemas de cookies,
            # ya que a veces Django maneja el dominio automáticamente.
            proxy_cookie_path / "/; HttpOnly; SameSite=Lax";

            # Esta línea puede ser redundante si usas $http_host, pero no hace daño
            proxy_cookie_domain formacion_web $host;

            proxy_redirect off;
        }
}

