# /nginx/nginx.conf
upstream formacion_web {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 50M;

    location /static/ {
        alias /vol/web/staticfiles/;
    }

    location / {
        proxy_pass http://formacion_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}