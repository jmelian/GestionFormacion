# /nginx/nginx.conf
upstream formacion_web {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 50M;

    location /static/ {
        alias /vol/web/staticfiles/;
    }

	location / {
    	proxy_pass http://formacion_web;

	    # Directivas esenciales para pasar las cabeceras del host y del protocolo
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;

	    # Directivas de cookies para asegurar el correcto manejo
    	proxy_cookie_path / "/; HttpOnly; SameSite=Lax";
	    proxy_cookie_domain formacion_web $host;

    	proxy_redirect off;
	}

}
