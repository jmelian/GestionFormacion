# /nginx/nginx.conf
upstream formacion_web {
    server web:8000;
}

server {
    listen 80;

    location /static/ {
        # La ruta debe coincidir con el volumen montado en docker-compose.yml
        alias /vol/web/staticfiles/; 
    }

    location /media/ {
        # La ruta debe coincidir con el volumen montado en docker-compose.yml
        alias /vol/web/media/;
    }

    location / {
        proxy_pass http://formacion_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}