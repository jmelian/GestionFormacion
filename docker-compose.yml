# docker-compose.yml

version: '3.8'

services:
  web:
    build: . # Docker construirá la imagen usando el Dockerfile en el directorio actual.
    volumes:
      - .:/app # Monta el directorio local en el contenedor para desarrollo en tiempo real.
    # Expone el puerto 8000 para que Nginx se conecte
    expose:
      - 8000
    env_file:
      - ./.dockerenv # Carga las variables de entorno desde el archivo .env.
    depends_on:
      - db # Asegura que el servicio 'db' esté corriendo antes de iniciar 'web'.
    # Nombre del servicio
    container_name: django_app
  
  nginx:
      # Usa la imagen oficial de Nginx
      image: nginx:latest
      # Mapea el puerto 80 del host al 80 del contenedor
      ports:
        - "80:80"
      # Monta el archivo de configuración de Nginx
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        # Monta los directorios static y media para que Nginx pueda acceder a ellos
        - ./staticfiles:/vol/web/staticfiles
        - ./media:/vol/web/media
      # Depende del servicio web
      depends_on:
        - web
      # Nombre del servicio
      container_name: nginx_proxy

  db:
    # Usa la imagen oficial de PostgreSQL
    image: postgres:15
    # Variables de entorno para la base de datos
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Monta un volumen para persistir los datos de la DB
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    # Nombre del servicio
    container_name: postgres_db

volumes:
  postgres_data:
