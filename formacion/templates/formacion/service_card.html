{# service_card.html - renderiza una card de servicio con datos pasados por contexto #}
<div class="col-md-6 col-lg-3 mb-4">
    <div class="card h-100 border-secondary" id="{{ prefix }}-card">
        <div class="card-header">
            <h5 class="card-title mb-0">
                <i class="fas fa-{{ icon }}"></i> {{ title }}
            </h5>
        </div>
        <div class="card-body">
            <div class="status-indicator mb-2">
                <span class="badge badge-secondary" id="{{ prefix }}-status">Cargando...</span>
            </div>
            <p class="card-text small" id="{{ prefix }}-message">{{ default_message }}</p>
            <div class="text-muted small" id="{{ prefix }}-details"></div>
        </div>
    </div>
</div>
